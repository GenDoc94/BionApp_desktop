name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package Windows portable
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win portable --publish never
      - name: Release notes
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v',''
          node scripts/release-notes.mjs $ver release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: BionApp ${{ github.ref_name }}
          body_path: release-notes.md
          files: release/BionApp.exe
          fail_on_unmatched_files: true
